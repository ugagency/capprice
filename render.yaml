services:
  # -----------------------------------------------------------
  # 1) CapSaaS (Portal SSO)
  # -----------------------------------------------------------
  - type: web
    name: saas-portal
    runtime: docker
    repo: https://github.com/ugagency/capprice
    branch: main
    rootDir: FASE_3/CapSaaS
    plan: free
    region: oregon
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: saas-db
          property: connectionString
      # Portas internas no Render: 10000 (padrão)
      - key: CAPSSYS_PUBLIC_URL
        sync: false 

      # Redirecionamento SSO (serão injetados no banco pelo update_redirects.py)
      - key: REDIRECT_URL_CAPPRICE
        value: https://cap-price-app.onrender.com/sso/callback
      - key: REDIRECT_URL_CAPTRANSPORTATION
        value: https://cap-transportation-app.onrender.com/sso/callback

  # -----------------------------------------------------------
  # 2) CapPrice (Precificador)
  # -----------------------------------------------------------
  - type: web
    name: cap-price-app
    runtime: docker
    repo: https://github.com/ugagency/capprice
    branch: main
    rootDir: FASE_3/cap-price-app
    plan: free
    region: oregon
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Connects to the SAME database (different schema if needed, or same tables)
      # Or you can create a second DB if you prefer isolation.
      # For now, linking to the same DB to save free tier slots.
      - key: DATABASE_URL
        fromDatabase:
          name: saas-db
          property: connectionString
      
      - key: CAPSSYS_INTERNAL_BASE_URL
        value: http://saas-portal:10000
      
      - key: CAPSSYS_PUBLIC_URL
        sync: false 

      - key: SSO_CLIENT_ID
        value: capprice
      - key: SSO_CLIENT_SECRET
        value: CapPrice@2026!A1
      - key: SSO_JWT_SECRET
        value: 1MK4774Frmmd0nyw44CNNwWMwggEOdTDvEnFGVTX
      - key: SSO_ISSUER
        value: capssys.local

  # -----------------------------------------------------------
  # 3) CapTransportation (Painel Logístico)
  # -----------------------------------------------------------
  - type: web
    name: cap-transportation-app
    runtime: docker
    repo: https://github.com/ugagency/capprice
    branch: main
    rootDir: FASE_3/CapTransportation
    plan: free
    region: oregon
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: saas-db
          property: connectionString
      
      - key: CAPSSYS_INTERNAL_BASE_URL
        value: http://saas-portal:10000
      
      - key: CAPSSYS_PUBLIC_URL
        sync: false 

      - key: SSO_CLIENT_ID
        value: captransportation
      - key: SSO_CLIENT_SECRET
        value: CapTransp@2026!A1
      - key: SSO_JWT_SECRET
        value: 1MK4774Frmmd0nyw44CNNwWMwggEOdTDvEnFGVTX
      - key: SSO_ISSUER
        value: capssys.local

databases:
  - name: saas-db
    databaseName: capssys_bd
    user: capssys_app
    plan: free
    region: oregon
    # PostgreSQL 16 is default on Render
